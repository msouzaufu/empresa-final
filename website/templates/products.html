{% extends 'base.html' %}
{% block title %}Produtos - DevGás{% endblock %}

{% block content %}
<h2>Produtos de Gás</h2>

<div class="container mt-5">
    <div class="row">
        {% for produto in produtos %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <img src="{{ produto.imagem_url }}" class="card-img-top" alt="{{ produto.nome }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ produto.nome }}</h5>
                        <p class="card-text">{{ produto.descricao }}</p>
                        <p class="card-text"><strong>Preço: R$ {{ produto.preco }}</strong></p>
                        <a href="{{ produto.link }}" class="btn btn-primary">Comprar</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
